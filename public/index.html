<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <title>AI Video Generator — LTX-2</title>
    <meta name="description"
        content="Generate stunning AI videos with LTX-2. Text-to-Video and Image-to-Video generation powered by ComfyUI.">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1f3a 50%, #0f1729 100%);
            min-height: 100vh;
            padding: 15px;
            color: #e0e6ed;
        }

        .container {
            width: 100%;
            max-width: 100vw;
            display: grid;
            grid-template-columns: 280px 1fr 400px; /* Workflows | Controls | Videos */
            gap: 0;
            height: 100vh;
            background: #0f172a;
            color: #f1f5f9;
            padding: 0;
            overflow: hidden;
        }

        /* Sidebar Panels */
        .sidebar-left {
            background: #1e293b;
            border-right: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .main-workspace {
            background: #0f172a;
            display: flex;
            flex-direction: column;
            padding: 0;
            overflow: hidden;
            position: relative;
        }

        .sidebar-right {
            background: #1e293b;
            border-left: 1px solid #334155;
            display: flex;
            flex-direction: column;
            padding: 15px;
            overflow-y: auto;
        }

        .workspace-header {
            padding: 15px 25px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #1e293b;
        }

        .workspace-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* Professional Timeline Multi-Layer */
        .timeline-editor-wrapper {
            background: #111827;
            border-top: 1px solid #334155;
            height: 450px;
            display: flex;
            flex-direction: column;
        }

        .timeline-toolbar {
            height: 40px;
            background: #1f2937;
            border-bottom: 1px solid #374151;
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 15px;
        }

        .timeline-scroll-area {
            flex: 1;
            overflow: auto;
            display: flex;
        }

        .timeline-track-headers {
            width: 120px;
            background: #1f2937;
            border-right: 1px solid #374151;
            display: flex;
            flex-direction: column;
        }

        .track-header {
            height: 60px;
            border-bottom: 1px solid #374151;
            display: flex;
            align-items: center;
            padding: 0 10px;
            font-size: 0.75em;
            font-weight: 700;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .timeline-tracks-content {
            flex: 1;
            position: relative;
            background-image: linear-gradient(90deg, #1f2937 1px, transparent 1px);
            background-size: 50px 100%; /* Grid units */
        }

        .timeline-track {
            height: 60px;
            border-bottom: 1px solid #374151;
            position: relative;
            width: 3000px; /* Very wide for complex projects */
        }

        .timeline-clip {
            position: absolute;
            height: 50px;
            top: 5px;
            background: linear-gradient(90deg, #4f46e5, #7c3aed);
            border: 1px solid #a78bfa;
            border-radius: 4px;
            color: white;
            font-size: 0.7em;
            padding: 4px 8px;
            cursor: grab;
            display: flex;
            align-items: center;
            gap: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .timeline-clip video {
            height: 100%;
            border-radius: 2px;
        }

        /* Override old styles for new layout */
        .controls-panel, .output-panel {
            background: transparent;
            box-shadow: none;
            border: none;
            padding: 0;
            max-height: none;
            overflow: visible;
            width: 100%;
        }

        .placeholder { display: none; }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
                min-height: 100vh;
                border-radius: 0;
                padding: 15px;
                padding-top: 40px;
                /* Evita corte arriba en mobile */
            }

            body {
                padding: 0;
                align-items: flex-start;
            }
        }

        .controls-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            position: sticky;
            top: 15px;
            max-height: calc(100vh - 30px);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .controls-panel::-webkit-scrollbar {
            width: 6px;
        }

        .controls-panel::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.4);
            border-radius: 10px;
        }

        .controls-panel::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 10px;
        }

        .controls-panel::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
        }

        .output-panel {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                0 0 0 1px rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.2);
            min-height: 300px;
            max-height: calc(100vh - 50px);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }

        .output-panel::-webkit-scrollbar {
            width: 8px;
        }

        .output-panel::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.4);
            border-radius: 10px;
        }

        .output-panel::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 10px;
        }

        .output-panel::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
        }

        h1 {
            text-align: center;
            font-size: 1.6em;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            letter-spacing: -1px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 20px;
            font-size: 0.8em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #cbd5e1;
            font-size: 0.75em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        label span {
            float: right;
            color: #a855f7;
            font-weight: 700;
            font-size: 1em;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
        }

        textarea {
            width: 100%;
            padding: 10px;
            background: rgba(30, 41, 59, 0.6);
            border: 2px solid rgba(99, 102, 241, 0.3);
            border-radius: 8px;
            color: #e0e6ed;
            font-size: 0.9em;
            resize: vertical;
            min-height: 60px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        textarea:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
            background: rgba(30, 41, 59, 0.8);
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 10px;
            outline: none;
            -webkit-appearance: none;
            appearance: none;
            margin-top: 5px;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.6);
            transition: all 0.2s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.8);
        }

        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.6);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            margin-bottom: 0;
        }

        button {
            width: 100%;
            padding: 12px 20px;
            font-size: 0.9em;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Inter', sans-serif;
        }

        #generateButton {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        #generateButton:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6);
        }


        .progress-container {
            width: 100%;
            margin-top: 15px;
            display: none;
            position: relative;
            z-index: 10;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: rgba(30, 41, 59, 0.8);
            border-radius: 15px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #8b5cf6, #a855f7);
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 0.85em;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }

            100% {
                background-position: -200% 0;
            }
        }

        .progress-text {
            margin-top: 8px;
            text-align: center;
            color: #94a3b8;
            font-size: 0.8em;
        }

        #videoContainer {
            width: 100%;
            max-width: 800px;
            display: none !important;
        }

        #videoContainer video {
            width: 100%;
            height: auto;
            max-height: 600px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(99, 102, 241, 0.2);
            background: #000;
            object-fit: contain;
        }

        #videoContainer video::-webkit-media-controls {
            display: flex !important;
        }

        #videoContainer video::-webkit-media-controls-panel {
            display: flex !important;
        }

        #imageContainer {
            width: 100%;
            max-width: 800px;
            display: none;
        }

        #imageContainer img {
            width: 100%;
            max-width: 800px;
            height: auto;
            max-height: 600px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        #imageContainer video {
            width: 100%;
            max-width: 800px;
            height: auto;
            max-height: 600px;
            border-radius: 15px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(99, 102, 241, 0.2);
            background: #000;
            object-fit: contain;
        }

        #imageContainer video::-webkit-media-controls {
            display: flex !important;
        }

        #imageContainer video::-webkit-media-controls-panel {
            display: flex !important;
        }

        .placeholder {
            text-align: center;
            color: #64748b;
            padding: 40px 20px;
        }

        .placeholder svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
                gap: 20px;
            }

            .controls-panel {
                position: relative;
                top: 0;
            }
        }

        .params-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        #videoGallery {
            width: 100%;
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 10px;
        }

        .gallery-item {
            background: rgba(30, 41, 59, 0.6);
            border-radius: 10px;
            padding: 12px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .gallery-item:hover {
            border-color: rgba(99, 102, 241, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .gallery-item video {
            width: 100%;
            height: auto;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 8px;
            cursor: pointer;
            background: #000;
        }

        .gallery-item-label {
            margin-top: 8px;
            font-size: 0.75em;
            color: #94a3b8;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .gallery-title {
            grid-column: 1 / -1;
            color: #cbd5e1;
            font-size: 1.2em;
            margin-bottom: 10px;
            text-align: center;
            font-weight: 600;
        }

        #promptSequence {
            max-height: 400px;
            overflow-y: auto;
            overflow-x: hidden;
            padding-right: 5px;
            margin-bottom: 10px;
        }

        #promptSequence::-webkit-scrollbar {
            width: 5px;
        }

        #promptSequence::-webkit-scrollbar-track {
            background: rgba(30, 41, 59, 0.4);
            border-radius: 10px;
        }

        #promptSequence::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 10px;
        }

        #promptSequence::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #8b5cf6, #a855f7);
        }

        .prompt-item {
            margin-bottom: 15px;
            padding: 15px;
            background: rgba(30, 41, 59, 0.4);
            border-radius: 12px;
            border: 1px solid rgba(99, 102, 241, 0.2);
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .prompt-status {
            font-size: 0.85em;
            color: #a5b4fc;
            font-weight: 600;
        }

        .remove-prompt {
            background: rgba(239, 68, 68, 0.3);
            color: #ef4444;
            border: none;
            border-radius: 4px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 0.7em;
            transition: all 0.2s ease;
        }

        .remove-prompt:hover {
            background: rgba(239, 68, 68, 0.5);
            transform: scale(1.05);
        }

        .sequence-prompt {
            width: 100%;
            padding: 12px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            color: #e0e6ed;
            font-size: 1em;
            line-height: 1.5;
            resize: vertical;
            min-height: 120px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .sequence-prompt:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.3);
            background: rgba(30, 41, 59, 0.8);
        }

        /* Estilos para modo de selección de blending */
        .blend-controls {
            width: 100%;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(30, 41, 59, 0.6);
            border-radius: 10px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            display: none;
        }

        .blend-controls.active {
            display: block;
        }

        .blend-button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .blend-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .blend-button:disabled {
            background: rgba(100, 116, 139, 0.5);
            cursor: not-allowed;
            transform: none;
        }

        .cancel-blend-button {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .cancel-blend-button:hover {
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
        }

        .gallery-item.selectable {
            cursor: pointer;
            position: relative;
        }

        .gallery-item.selected {
            border-color: #10b981;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
            background: rgba(16, 185, 129, 0.1);
        }

        .gallery-item.selected::after {
            content: '✓';
            position: absolute;
            top: 10px;
            right: 10px;
            width: 30px;
            height: 30px;
            background: #10b981;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.2em;
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.5);
        }

        .selection-order {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 30px;
            height: 30px;
            background: #6366f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9em;
            box-shadow: 0 2px 10px rgba(99, 102, 241, 0.5);
        }

        .blend-info {
            text-align: center;
            color: #94a3b8;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .blend-duration-control {
            margin-bottom: 15px;
        }

        .blend-duration-control label {
            display: block;
            margin-bottom: 5px;
            color: #cbd5e1;
            font-size: 0.8em;
        }

        /* ===== IMAGE UPLOAD SECTION ===== */
        .image-upload-section {
            margin-bottom: 18px;
        }

        .image-upload-area {
            position: relative;
            width: 100%;
            min-height: 100px;
            border: 2px dashed rgba(99, 102, 241, 0.35);
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            overflow: hidden;
            padding: 15px;
        }

        .image-upload-area:hover {
            border-color: rgba(99, 102, 241, 0.7);
            background: rgba(30, 41, 59, 0.6);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.15);
        }

        .image-upload-area.dragover {
            border-color: #a855f7;
            background: rgba(168, 85, 247, 0.1);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.2);
        }

        .image-upload-area.has-image {
            border-color: rgba(16, 185, 129, 0.5);
            border-style: solid;
            background: rgba(16, 185, 129, 0.05);
            min-height: 0;
            padding: 8px;
        }

        .upload-placeholder {
            text-align: center;
            color: #64748b;
            pointer-events: none;
        }

        .upload-placeholder svg {
            width: 36px;
            height: 36px;
            margin-bottom: 6px;
            opacity: 0.5;
        }

        .upload-placeholder p {
            font-size: 0.8em;
            margin-bottom: 3px;
        }

        .upload-placeholder .upload-hint {
            font-size: 0.7em;
            color: #475569;
        }

        .image-preview-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .image-preview-container img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid rgba(99, 102, 241, 0.3);
            flex-shrink: 0;
        }

        .image-preview-info {
            flex: 1;
            min-width: 0;
        }

        .image-preview-info .filename {
            font-size: 0.78em;
            color: #e0e6ed;
            font-weight: 500;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .image-preview-info .mode-badge {
            display: inline-block;
            margin-top: 4px;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.68em;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .mode-badge.i2v {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.2));
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .mode-badge.t2v {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2));
            color: #a5b4fc;
            border: 1px solid rgba(99, 102, 241, 0.3);
        }

        .remove-image-btn {
            width: 28px !important;
            height: 28px;
            min-width: 28px;
            padding: 0 !important;
            border-radius: 50% !important;
            background: rgba(239, 68, 68, 0.2) !important;
            color: #ef4444 !important;

                    </div>
                    
                    <div class="controls" style="margin-top: 20px; display: flex; gap: 10px;">
                        <button id="generateButton" style="flex: 3; height: 50px; font-size: 1.1em; background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">🚀 LAUNCH GENERATION</button>
                        <button id="stopButton" style="flex: 1; background: #ef4444; color: white; border: none; border-radius: 8px; cursor: pointer; display: none; font-weight: bold;">🛑 ABORT</button>
                    </div>
                </div>

                <div class="tab-content" id="tabPrompts">
                    <div class="prompts-scroller" style="flex: 1; overflow-y: auto; padding: 10px;">
                        <div id="simplePromptContainer">
                            <label style="display: block; margin-bottom: 10px; color: #94a3b8; font-size: 0.8em; text-transform: uppercase;">Main Prompt</label>
                            <textarea id="prompt" placeholder="Write your prompt..." style="width: 100%; min-height: 150px; background: #1e293b; border: 1px solid #334155; color: white; padding: 15px; border-radius: 8px; font-family: inherit; margin-bottom: 20px;"></textarea>
                        </div>
                        <div id="advancedMode" class="advanced-panel" style="display: none;">
                            <label style="display: block; margin-bottom: 10px; color: #94a3b8; font-size: 0.8em; text-transform: uppercase;">Global Style/Prompt</label>
                            <textarea id="promptGeneral" class="prompt-general-textarea" placeholder="Style to apply to all steps..." style="width: 100%; height: 80px; background: #1e293b; border: 1px solid #334155; color: #cbd5e1; padding: 10px; border-radius: 8px; margin-bottom: 15px;"></textarea>
                            <div id="promptSequence"></div>
                            <button id="addPromptButton" class="add-prompt-btn" style="width: 100%; padding: 10px; background: rgba(99, 102, 241, 0.1); color: #818cf8; border: 1px dashed #818cf8; border-radius: 8px; cursor: pointer; margin: 10px 0;">+ Add Sequence Step</button>
                        </div>
                    </div>
                    <div class="controls" style="margin-top: 10px; padding: 10px;">
                        <button class="generate-from-prompts" style="width: 100%; height: 45px; background: #6366f1; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">GENERATE FROM SEQUENCER</button>
                    </div>
                </div>

                <div class="tab-content" id="tabEditor">
                    <!-- Monitor de Previsualización del Editor -->
                    <div id="editorMonitor" style="flex: 1; background: #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;">
                        <video id="timelinePreview" style="max-height: 100%; max-width: 100%;" muted></video>
                        <div id="editorPlaceholder" style="color: #475569;">Preview Timeline</div>
                    </div>
                    <div class="editor-controls" style="padding: 10px; display: flex; justify-content: center; gap: 20px; background: rgba(15, 23, 42, 0.5);">
                         <div style="display: flex; gap: 10px;">
                            <button id="tlPlayBtn" style="background: #10b981; color: white; border: none; padding: 5px 20px; border-radius: 4px; cursor: pointer;">PLAY</button>
                            <button id="tlStopBtn" style="background: #ef4444; color: white; border: none; padding: 5px 20px; border-radius: 4px; cursor: pointer;">STOP</button>
                         </div>
                    </div>
                </div>
            </div>
            <!-- THE PROFESSIONAL TIMELINE -->
            <div class="timeline-editor-wrapper" id="masterTimeline">
                <div class="timeline-toolbar" style="display: flex; justify-content: space-between; align-items: center; padding: 5px 15px; background: #1e293b;">
                    <span style="font-size: 0.7em; font-weight: bold; color: #6366f1; text-transform: uppercase;">Timeline Maestro v1.1</span>
                    <button id="exportProjectBtn" style="width: auto; padding: 4px 12px; font-size: 0.7em; background: #059669; border: none; border-radius: 4px; color: white; cursor: pointer; font-weight: bold;">EXPORT FINAL VIDEO</button>
                </div>
                <div class="timeline-scroll-area">
                    <div class="timeline-track-content-wrapper" style="position: relative; display: flex;">
                        <div class="timeline-track-headers" style="width: 80px; flex-shrink: 0; background: #1e293b; border-right: 1px solid #334155;">
                            <div class="track-header" style="height: 40px; border-bottom: 1px solid #0f172a; font-size: 0.6em; display: flex; align-items: center; justify-content: center; color: #94a3b8;">V3</div>
                            <div class="track-header" style="height: 40px; border-bottom: 1px solid #0f172a; font-size: 0.6em; display: flex; align-items: center; justify-content: center; color: #94a3b8;">V2</div>
                            <div class="track-header" style="height: 40px; border-bottom: 1px solid #0f172a; font-size: 0.6em; display: flex; align-items: center; justify-content: center; color: #94a3b8;">V1</div>
                            <div class="track-header" style="height: 40px; font-size: 0.6em; display: flex; align-items: center; justify-content: center; color: #94a3b8;">A1</div>
                        </div>
                        <div class="timeline-tracks-content" id="editorTimeline" style="flex: 1; position: relative; height: 160px; overflow-x: auto; background-image: linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px); background-size: 50px 40px;">
                            <div class="timeline-track" data-track="V3" style="height: 40px; border-bottom: 1px solid #1e293b; position: relative;"></div>
                            <div class="timeline-track" data-track="V2" style="height: 40px; border-bottom: 1px solid #1e293b; position: relative;"></div>
                            <div class="timeline-track" data-track="V1" style="height: 40px; border-bottom: 1px solid #1e293b; position: relative;"></div>
                            <div class="timeline-track" data-track="A1" style="height: 40px; position: relative;"></div>
                            <div class="timeline-empty-msg" style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #334155; pointer-events: none; font-size: 0.8em; text-transform: uppercase; letter-spacing: 2px;">Drag Assets Here</div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- RIGHT SIDEBAR: ASSETS & STATUS -->
        <aside class="sidebar-right">
            <h2 style="font-size: 0.85em; margin-bottom: 15px; color: #a855f7; text-transform: uppercase; letter-spacing: 1px;">📦 Studio Assets</h2>
            <div id="videoGallery"></div>

            <div class="status-console" id="statusConsole" style="margin-top: 20px; border-radius: 8px; background: #020617; border: 1px solid #1e293b;">
                <div class="console-header" style="padding: 5px 10px; background: #1e293b; border-bottom: 1px solid #334155; font-size: 0.6em; color: #64748b;">Engine Logs</div>
                <div class="console-body" id="consoleBody" style="font-size: 0.65em; height: 120px; padding: 10px; color: #34d399; font-family: monospace;"></div>
            </div>
        </aside>
    </div>

    <script src="js/script.js"></script>
</body>

</html>
